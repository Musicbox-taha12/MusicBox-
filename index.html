<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusicBox | دنیای موسیقی</title>

    <style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 30px 20px;
    text-align: center;
    background: #12121a;
}

header h1 {
    font-size: 38px;
}

header p {
    color: #999;
    margin-top: 8px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 15px;
}

.search {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 15px;
    background: #1b1b25;
    color: white;
    outline: none;
    font-size: 16px;
    margin-bottom: 20px;
}

.music-card {
    background: #17171f;
    padding: 18px;
    border-radius: 20px;
    margin-bottom: 15px;
}

.cover {
    width: 100%;
    height: 220px;
    border-radius: 18px;
    background: #292933;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    margin-bottom: 15px;
}

.info h2 {
    font-size: 21px;
}

.info p {
    color: #888;
    margin-top: 7px;
}

audio {
    width: 100%;
    margin-top: 18px;
}
      .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
      }
      .hero {
    background: #1b1b25;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 20px;
}

.hero h2 {
    font-size: 24px;
    margin-bottom: 10px;
}

.hero p {
    color: #999;
    line-height: 1.8;
      }
    </style>
</head>

<body>

</div>

<audio controls>

</audio>

<div class="info">

        <audio controls>
    <source src="music/Nahkoda.mp3" type="audio/mpeg">
        </audio>
<script>
const search = document.querySelector(".search");
const songs = document.querySelectorAll(".music-card");

search.addEventListener("input", function () {
    const text = search.value.toLowerCase();

    songs.forEach(function (song) {
        const name = song.innerText.toLowerCase();

        if (name.includes(text)) {
            song.style.display = "block";
        } else {
            song.style.display = "none";
        }
    
});
</script>
          <h2>آهنگ‌های من 🎵</h2>

<div>

</html>
