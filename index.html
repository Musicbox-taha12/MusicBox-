<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusicBox | دنیای موسیقی</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 25px;
            text-align: center;
            background: #181818;
        }

        header h1 {
            font-size: 35px;
        }

        header p {
            margin-top: 10px;
            color: #aaa;
        }

        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .search {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            outline: none;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .music-card {
            background: #1d1d1d;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cover {
            width: 70px;
            height: 70px;
            background: #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .info {
            flex: 1;
        }

        .info h2 {
            font-size: 18px;
        }

        .info p {
            color: #999;
            margin-top: 6px;
        }

        button {
            background: #00c853;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
        }
        <script>
const search = document.querySelector(".search");
const songs = document.querySelectorAll(".music-card");

search.addEventListener("input", function () {
    const text = search.value.toLowerCase();

    songs.forEach(function (song) {
        const name = song.innerText.toLowerCase();

        if (name.includes(text)) {
            song.style.display = "block";
        } else {
            song.style.display = "none";
        }
    });
});
</script>
    </style>
</head>

<body>

<header>
    <h1>🎵 MusicBox</h1>
    <p>دنیای آهنگ‌های مورد علاقه تو</p>
</header>

<div class="container">

    <input
        class="search"
        type="text"
        placeholder="🔎 جستجوی آهنگ..."
    >

    <div class="music-card">
        <div class="cover">🎵</div>

        <div class="info">
            <h2>آهنگ نمونه</h2>
            <p>خواننده نمونه</p>
        </div>
        <button>▶ پخش</button>
    </div>
<h2>آهنگ‌های من 🎵</h2>

<div>
  <img src="cover1.jpg" alt="عکس" width="300">
</div>

<audio controls>
  <source src="GTA 6.mp3" type="audio/mpeg">
  مرورگر شما از پخش آهنگ پشتیبانی نمی‌کند.
</audio>
    <div class="music-card">
        <div class="cover">🎧</div>

        <div class="info">
            <h2>آهنگ دوم</h2>
            <p>خواننده دوم</p>
        </div>

        <button>▶ پخش</button>
    </div>

</div>

</body>
</html>
